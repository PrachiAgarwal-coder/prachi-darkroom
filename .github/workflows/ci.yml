# Runs on every push and pull request. No GPU and no secrets: the Python tests use a tiny,
# randomly initialised Stable Diffusion and stubbed scorers, so they need no model downloads.
name: CI

on:
  push:
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "diffusers>=0.30" "transformers>=4.44" accelerate "peft>=0.12" safetensors \
            optimum-quanto fastapi "uvicorn[standard]" opencv-python-headless numpy pillow pytest httpx
      - name: Tests
        working-directory: server
        run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit -p .
      - name: Lint
        run: bunx eslint src
      - name: Build
        run: bun run build
